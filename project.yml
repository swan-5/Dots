name: Dots
options:
  bundleIdPrefix: com.dots.app
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.0
    CODE_SIGN_STYLE: Automatic

targets:
  Dots:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Dots
    info:
      path: Dots/App/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Dots
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dots.app
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  DotsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DotsTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dots.app.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Dots

schemes:
  Dots:
    build:
      targets:
        Dots: all
        DotsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DotsTests
    archive:
      config: Release
